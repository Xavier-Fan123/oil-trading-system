name: Manual Regression Test Suite

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Regression suite to run'
        required: true
        default: all
        type: choice
        options:
          - all
          - backend
          - frontend

concurrency:
  group: manual-regression-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20'

jobs:
  backend-regression:
    name: Backend Regression
    if: ${{ github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'backend' }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: OilTradingTestDb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d OilTradingTestDb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore solution
        run: dotnet restore OilTrading.sln

      - name: Build solution
        run: dotnet build OilTrading.sln --configuration Release --no-restore

      - name: Run unit tests
        run: |
          dotnet test tests/OilTrading.UnitTests/OilTrading.UnitTests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=unit-tests.trx" \
            --results-directory ./test-results

      - name: Run integration tests
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=OilTradingTestDb;Username=postgres;Password=postgres
          ConnectionStrings__Redis: localhost:6379
          ConnectionStrings__RedisConnection: localhost:6379
        run: |
          dotnet test tests/OilTrading.IntegrationTests/OilTrading.IntegrationTests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=integration-tests.trx" \
            --results-directory ./test-results

      - name: Upload backend regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-regression-results
          if-no-files-found: warn
          path: test-results/

  frontend-regression:
    name: Frontend Regression
    if: ${{ github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'frontend' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npm run type-check

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend regression build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-regression-dist
          if-no-files-found: warn
          path: frontend/dist/
